apply plugin: 'com.android.application'

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.example.studyopengl"
        minSdkVersion 21        // OpenGL ES 3.0 需要 API 18+，取 21 覆盖绝大多数设备
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 要求 1：使用 Java 7 语言特性
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    lint {
        abortOnError false
    }
}

// 零第三方依赖：全部使用 Android 框架 API（GLES30 / EGL14）
dependencies {
}
